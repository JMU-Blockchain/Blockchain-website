<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Member Portal | JMU Blockchain</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --jmu-purple: #450084;
            --jmu-gold: #C2A14D;
            --slate-950: #070a13;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { background-color: var(--slate-950); color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden; line-height: 1.6; }
        .bg-animate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a0033 0%, var(--slate-950) 100%); z-index: -2; }
        .bg-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(var(--glass-border) 1px, transparent 1px), linear-gradient(90deg, var(--glass-border) 1px, transparent 1px); background-size: 50px 50px; z-index: -1; mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%); }

        /* --- CENTERED NAVIGATION --- */
        .navbar { background: rgba(7, 10, 19, 0.98) !important; backdrop-filter: blur(25px); border-bottom: 1px solid var(--glass-border) !important; padding: 15px 0; position: sticky; top: 0; z-index: 1000; }
        .nav-logo { height: 55px; width: auto; }
        .nav-links { display: flex; gap: 30px; align-items: center; justify-content: center; flex-grow: 1; } /* Added centering logic */
        .nav-item { text-decoration: none; color: #FFFFFF !important; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s; }
        .nav-item:hover { color: var(--jmu-gold) !important; }

        .portal-header { padding: 60px 0 40px; text-align: center; }
        
        /* --- CENTERED FILTER BAR --- */
        .filter-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        .filter-btn { 
            background: var(--glass); border: 1px solid var(--glass-border); color: #94a3b8; 
            padding: 10px 25px; border-radius: 30px; cursor: pointer; font-weight: 800; 
            font-size: 0.75rem; transition: 0.3s; text-transform: uppercase;
        }
        .filter-btn.active { background: var(--jmu-purple); color: white; border-color: var(--jmu-gold); box-shadow: 0 0 15px rgba(194, 161, 77, 0.2); }

        .post-form { background: var(--glass); border: 1px solid var(--glass-border); padding: 35px; border-radius: 28px; max-width: 850px; margin: 0 auto 60px; }
        .post-form input, .post-form select { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white; padding: 12px; border-radius: 10px; font-family: 'Plus Jakarta Sans'; outline: none; }
        .post-btn { background: var(--jmu-gold); color: black; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .post-btn:hover { transform: scale(1.05); }

        .repo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; margin-bottom: 80px; }
        .repo-card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); padding: 35px; border-radius: 24px; transition: 0.4s; position: relative; }
        .repo-card:hover { transform: translateY(-8px); border-color: var(--jmu-gold); background: rgba(255,255,255,0.06); }
        .repo-tag { font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--jmu-gold); text-transform: uppercase; margin-bottom: 12px; display: block; }
        
        .delete-btn { position: absolute; top: 15px; right: 15px; background: #ef4444; color: white; border: none; width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-weight: 800; display: none; z-index: 10; }
        .logout-btn { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 10px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; white-space: nowrap; }

        @media (max-width: 768px) { 
            .nav-links { display: none !important; } 
            .post-form input { width: 100%; margin-bottom: 15px; } 
            .post-form div { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="bg-animate"></div><div class="bg-grid"></div>

    <nav class="navbar">
        <div class="container" style="display: flex; align-items: center; justify-content: space-between; width: 90%; max-width: 1400px; margin: 0 auto;">
            <a href="index.html"><img src="assets/blockchain.png" alt="Logo" class="nav-logo"></a>
            
            <div class="nav-links">
                <a href="index.html" class="nav-item">Home</a>
                <a href="projects.html" class="nav-item">Projects</a>
                <a href="research.html" class="nav-item">Research</a>
                <a href="index.html#team" class="nav-item">Leadership</a>
            </div>

            <div style="border-left: 2px solid var(--glass-border); padding-left: 20px;">
                <button class="logout-btn" id="logout-btn">LOGOUT</button>
            </div>
        </div>
    </nav>

    <main class="container" style="width: 90%; max-width: 1200px; margin: 0 auto;">
        <header class="portal-header">
            <p style="color: var(--jmu-gold); font-weight: 800; letter-spacing: 3px; font-family: 'JetBrains Mono';">LEADERBOARD & LEDGER</p>
            <h1>The Vault<span>.</span></h1>
            <p style="color: #94a3b8; margin-top: 15px;">Authenticated Session: <span id="user-display-name" style="color:#fff; font-weight:700;">Member</span></p>
        </header>

        <section class="post-form">
            <h3 style="margin-top: 0; font-size: 0.9rem; color: var(--jmu-gold); text-transform: uppercase; letter-spacing: 2px;">Contribute to the Ledger</h3>
            <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px;">
                <input type="text" id="post-title" placeholder="Resource Title" style="flex: 2;">
                <input type="text" id="post-link" placeholder="URL (https://...)" style="flex: 2;">
                <select id="post-category" style="flex: 1; min-width: 150px;">
                    <option value="Internal Docs">Internal Docs</option>
                    <option value="Research">Research</option>
                    <option value="Beta Access">Beta Access</option>
                </select>
                <button class="post-btn" id="submit-post">POST DATA</button>
            </div>
        </section>

        <div class="filter-bar">
            <button class="filter-btn active" id="filter-All">All Resources</button>
            <button class="filter-btn" id="filter-Internal Docs">Internal Docs</button>
            <button class="filter-btn" id="filter-Research">Research</button>
            <button class="filter-btn" id="filter-Beta Access">Beta Access</button>
        </div>
        
        <div class="repo-grid" id="dynamic-grid"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBfORDp5vNAT6gHFrtmgywJ9wong1bAuo0", authDomain: "jmu-blockchain-member.firebaseapp.com", projectId: "jmu-blockchain-member", storageBucket: "jmu-blockchain-member.firebasestorage.app", messagingSenderId: "98129620187", appId: "1:98129620187:web:d544b08841092ac497f0fe", measurementId: "G-VPLWE1FYZ4" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        let currentFilter = "All";
        let allData = [];

        onAuthStateChanged(auth, (user) => {
            if (!user && sessionStorage.getItem('isMember') !== 'true') window.location.href = "index.html";
            else if (user) document.getElementById('user-display-name').innerText = user.email;
        });

        document.getElementById('submit-post').addEventListener('click', async () => {
            const title = document.getElementById('post-title').value;
            const link = document.getElementById('post-link').value;
            const category = document.getElementById('post-category').value;
            if (title && link) {
                try {
                    await addDoc(collection(db, "vault_content"), { 
                        title, link, category, 
                        author: auth.currentUser.email, 
                        timestamp: serverTimestamp() 
                    });
                    document.getElementById('post-title').value = ""; 
                    document.getElementById('post-link').value = "";
                } catch (e) { alert("Error: " + e.message); }
            }
        });

        const q = query(collection(db, "vault_content"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            allData = [];
            snapshot.forEach(doc => allData.push({ id: doc.id, ...doc.data() }));
            renderGrid();
        });

        // Mapping Filter Buttons
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.id.replace('filter-', '');
                renderGrid();
            });
        });

        function renderGrid() {
            const grid = document.getElementById('dynamic-grid');
            grid.innerHTML = "";
            const filtered = currentFilter === "All" ? allData : allData.filter(d => d.category === currentFilter);
            
            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #64748b;">No items found in ${currentFilter}.</div>`;
                return;
            }

            filtered.forEach(data => {
                const isAdmin = auth.currentUser && auth.currentUser.email === "charliemonfort17@gmail.com";
                const card = document.createElement('div');
                card.className = 'repo-card';
                card.innerHTML = `
                    <button class="delete-btn" style="${isAdmin ? 'display:block' : 'display:none'}">×</button>
                    <a href="${data.link}" target="_blank" style="text-decoration:none; color:inherit;">
                        <span class="repo-tag">${data.category}</span>
                        <h4 style="margin: 0 0 10px 0; font-size: 1.2rem;">${data.title}</h4>
                        <p style="font-size: 0.8rem; color: #64748b; margin: 0;">Verified by ${data.author.split('@')[0]}</p>
                    </a>
                `;
                
                const dBtn = card.querySelector('.delete-btn');
                dBtn.addEventListener('click', async () => {
                    if(confirm("Confirm deletion?")) await deleteDoc(doc(db, "vault_content", data.id));
                });

                grid.appendChild(card);
            });
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut(auth); sessionStorage.removeItem('isMember'); window.location.href = "index.html";
        });
    </script>
</body>
</html>
