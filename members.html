<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Member Portal | JMU Blockchain</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --jmu-purple: #450084;
            --jmu-gold: #C2A14D;
            --slate-950: #070a13;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { background-color: var(--slate-950); color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden; line-height: 1.6; }

        .bg-animate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a0033 0%, var(--slate-950) 100%); z-index: -2; }
        .bg-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(var(--glass-border) 1px, transparent 1px), linear-gradient(90deg, var(--glass-border) 1px, transparent 1px); background-size: 50px 50px; z-index: -1; mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%); }

        .navbar { background: rgba(7, 10, 19, 0.98) !important; backdrop-filter: blur(25px); border-bottom: 1px solid var(--glass-border) !important; padding: 15px 0; position: sticky; top: 0; z-index: 1000; }
        .nav-logo { height: 55px; width: auto; }
        .nav-item { text-decoration: none; color: #FFFFFF !important; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s; }

        .portal-header { padding: 60px 0 40px; text-align: center; }
        
        /* POSTING FORM STYLE */
        .post-form {
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 30px; border-radius: 24px; max-width: 800px; margin: 0 auto 60px;
        }
        .post-form input, .post-form select {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: white; padding: 12px; border-radius: 10px; margin-right: 10px; margin-bottom: 10px;
            font-family: 'Plus Jakarta Sans'; outline: none;
        }
        .post-btn { background: var(--jmu-gold); color: black; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 800; cursor: pointer; }

        /* DYNAMIC GRID */
        .repo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .repo-card {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); padding: 35px; border-radius: 24px;
            transition: 0.4s; text-decoration: none; color: inherit;
        }
        .repo-card:hover { transform: translateY(-8px); border-color: var(--jmu-gold); background: rgba(255,255,255,0.06); }
        .repo-tag { font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--jmu-gold); text-transform: uppercase; margin-bottom: 10px; display: block; }

        .logout-btn { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 10px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; }

        @media (max-width: 768px) { .nav-links { display: none !important; } .post-form input { width: 100%; } }
    </style>
</head>
<body>

    <div class="bg-animate"></div>
    <div class="bg-grid"></div>

    <nav class="navbar">
        <div class="container" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <a href="index.html"><img src="assets/blockchain.png" alt="Logo" class="nav-logo"></a>
            <div class="nav-links" style="display: flex; gap: 25px; align-items: center;">
                <a href="index.html" class="nav-item">Home</a>
                <a href="projects.html" class="nav-item">Projects</a>
                <a href="research.html" class="nav-item">Research</a>
            </div>
            <div style="border-left: 2px solid var(--glass-border); padding-left: 20px;">
                <button class="logout-btn" id="logout-btn">LOGOUT</button>
            </div>
        </div>
    </nav>

    <main class="container" style="width: 90%; max-width: 1200px; margin: 0 auto;">
        
        <header class="portal-header">
            <p style="color: var(--jmu-gold); font-weight: 800; letter-spacing: 3px; font-family: 'JetBrains Mono';">LEADERBOARD & LEDGER</p>
            <h1>The Vault<span>.</span></h1>
            <p style="color: #94a3b8; margin-top: 15px;">Welcome, <span id="user-display-name">Pioneer</span>. Contribute resources to the club repository below.</p>
        </header>

        <section class="post-form">
            <h3 style="margin-top: 0; font-size: 1rem; color: var(--jmu-gold);">ADD TO THE LEDGER</h3>
            <div style="display: flex; flex-wrap: wrap;">
                <input type="text" id="post-title" placeholder="Resource Title (e.g. BTC Whitepaper)" style="flex: 2; min-width: 200px;">
                <input type="text" id="post-link" placeholder="URL Link (https://...)" style="flex: 2; min-width: 200px;">
                <select id="post-category">
                    <option value="Internal Docs">Internal Docs</option>
                    <option value="Research">Research</option>
                    <option value="Beta Access">Beta Access</option>
                </select>
                <button class="post-btn" id="submit-post">POST</button>
            </div>
        </section>

        <h2 style="font-size: 1.8rem; margin-bottom: 30px; border-left: 4px solid var(--jmu-gold); padding-left: 20px;">Live <span>Repository.</span></h2>
        
        <div class="repo-grid" id="dynamic-grid">
            </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBfORDp5vNAT6gHFrtmgywJ9wong1bAuo0",
            authDomain: "jmu-blockchain-member.firebaseapp.com",
            projectId: "jmu-blockchain-member",
            storageBucket: "jmu-blockchain-member.firebasestorage.app",
            messagingSenderId: "98129620187",
            appId: "1:98129620187:web:d544b08841092ac497f0fe",
            measurementId: "G-VPLWE1FYZ4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 1. Security Check
        onAuthStateChanged(auth, (user) => {
            if (!user && sessionStorage.getItem('isMember') !== 'true') {
                window.location.href = "index.html";
            } else if (user) {
                document.getElementById('user-display-name').innerText = user.email.split('@')[0];
            }
        });

        // 2. Submit Post Logic
        document.getElementById('submit-post').addEventListener('click', async () => {
            const title = document.getElementById('post-title').value;
            const link = document.getElementById('post-link').value;
            const category = document.getElementById('post-category').value;

            if (title && link) {
                try {
                    await addDoc(collection(db, "vault_content"), {
                        title: title,
                        link: link,
                        category: category,
                        author: auth.currentUser ? auth.currentUser.email : "Member",
                        timestamp: new Date()
                    });
                    document.getElementById('post-title').value = "";
                    document.getElementById('post-link').value = "";
                    alert("Confirmed: Data added to the ledger.");
                } catch (e) { alert("Error posting: " + e.message); }
            } else { alert("Please fill in both Title and Link."); }
        });

        // 3. Live Feed Logic (Reads Firestore automatically)
        const q = query(collection(db, "vault_content"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const grid = document.getElementById('dynamic-grid');
            grid.innerHTML = ""; // Clear existing
            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = `
                    <a href="${data.link}" target="_blank" class="repo-card">
                        <span class="repo-tag">${data.category}</span>
                        <h4 style="margin: 0 0 10px 0;">${data.title}</h4>
                        <p style="font-size: 0.8rem; color: #64748b; margin: 0;">Posted by: ${data.author.split('@')[0]}</p>
                    </a>
                `;
                grid.innerHTML += card;
            });
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut(auth);
            sessionStorage.removeItem('isMember');
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
