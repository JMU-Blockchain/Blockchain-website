<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Member Portal | JMU Blockchain</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --jmu-purple: #450084;
            --jmu-gold: #C2A14D;
            --slate-950: #070a13;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { background-color: var(--slate-950); color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden; line-height: 1.6; }
        .bg-animate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a0033 0%, var(--slate-950) 100%); z-index: -2; }
        .bg-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(var(--glass-border) 1px, transparent 1px), linear-gradient(90deg, var(--glass-border) 1px, transparent 1px); background-size: 50px 50px; z-index: -1; mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%); }

        /* --- CENTERED NAVIGATION --- */
        .navbar { background: rgba(7, 10, 19, 0.98) !important; backdrop-filter: blur(25px); border-bottom: 1px solid var(--glass-border) !important; padding: 15px 0; position: sticky; top: 0; z-index: 1000; }
        .nav-logo { height: 55px; width: auto; }
        .nav-links { display: flex; gap: 30px; align-items: center; justify-content: center; flex-grow: 1; }
        .nav-item { text-decoration: none; color: #FFFFFF !important; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s; }
        .nav-item:hover { color: var(--jmu-gold) !important; }

        .portal-layout { display: grid; grid-template-columns: 1fr 350px; gap: 40px; width: 90%; max-width: 1400px; margin: 0 auto; padding-bottom: 100px; }

        /* --- CHAT SIDEBAR --- */
        .chat-container { 
            background: var(--glass); border: 1px solid var(--glass-border); 
            border-radius: 24px; height: 600px; display: flex; flex-direction: column; 
            position: sticky; top: 120px; backdrop-filter: blur(15px);
        }
        .chat-header { padding: 20px; border-bottom: 1px solid var(--glass-border); text-align: center; }
        .chat-messages { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        .msg { padding: 12px 16px; border-radius: 15px; font-size: 0.85rem; max-width: 85%; }
        .msg.me { align-self: flex-end; background: var(--jmu-purple); color: white; border-bottom-right-radius: 2px; }
        .msg.them { align-self: flex-start; background: rgba(255,255,255,0.05); color: #cbd5e1; border-bottom-left-radius: 2px; }
        .msg-user { font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--jmu-gold); margin-bottom: 5px; display: block; }

        .chat-input-area { padding: 20px; border-top: 1px solid var(--glass-border); display: flex; gap: 10px; }
        .chat-input { flex-grow: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: white; padding: 10px; border-radius: 8px; outline: none; }
        .send-btn { background: var(--jmu-gold); border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: 800; }

        /* --- VAULT CONTENT AREA --- */
        .vault-main { min-width: 0; }
        .search-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 15px; border-radius: 15px; color: white; margin-bottom: 30px; outline: none; }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-btn { background: var(--glass); border: 1px solid var(--glass-border); color: #94a3b8; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .filter-btn.active { background: var(--jmu-purple); color: white; border-color: var(--jmu-gold); }

        .post-form { background: var(--glass); border: 1px solid var(--glass-border); padding: 25px; border-radius: 24px; margin-bottom: 40px; }
        .post-form input, .post-form select { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white; padding: 10px; border-radius: 8px; font-family: 'Plus Jakarta Sans'; margin-bottom: 10px; }
        .post-form select option { background: #1a1a1a; color: white; }
        
        .repo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .repo-card { background: var(--glass); border: 1px solid var(--glass-border); padding: 25px; border-radius: 20px; transition: 0.3s; position: relative; text-decoration: none; color: inherit; }
        .repo-card:hover { transform: translateY(-5px); border-color: var(--jmu-gold); }
        .repo-tag { font-family: 'JetBrains Mono'; font-size: 0.6rem; color: var(--jmu-gold); text-transform: uppercase; margin-bottom: 10px; display: block; }
        
        .delete-btn { position: absolute; top: 10px; right: 10px; background: #ef4444; color: white; border: none; width: 20px; height: 20px; border-radius: 4px; cursor: pointer; font-size: 12px; display: none; }
        .logout-btn { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 10px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; }

        @media (max-width: 1000px) { .portal-layout { grid-template-columns: 1fr; } .chat-container { position: static; height: 400px; order: -1; } .nav-links { display: none !important; } }
    </style>
</head>
<body>
    <div class="bg-animate"></div><div class="bg-grid"></div>

    <nav class="navbar">
        <div class="container" style="display: flex; align-items: center; justify-content: space-between; width: 90%; max-width: 1400px; margin: 0 auto;">
            <a href="index.html"><img src="assets/blockchain.png" alt="Logo" class="nav-logo"></a>
            <div class="nav-links">
                <a href="index.html" class="nav-item">Home</a>
                <a href="projects.html" class="nav-item">Projects</a>
                <a href="research.html" class="nav-item">Research</a>
                <a href="index.html#team" class="nav-item">Leadership</a>
            </div>
            <button class="logout-btn" id="logout-btn">LOGOUT</button>
        </div>
    </nav>

    <div class="portal-layout">
        
        <main class="vault-main">
            <header class="portal-header" style="text-align: left;">
                <p style="color: var(--jmu-gold); font-weight: 800; letter-spacing: 3px; font-family: 'JetBrains Mono';">CLASSIFIED LEDGER</p>
                <h1 style="font-size: 3rem;">The Vault<span>.</span></h1>
            </header>

            <section class="post-form">
                <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                    <input type="text" id="post-title" placeholder="Resource Title" style="flex: 2;">
                    <input type="text" id="post-link" placeholder="URL (https://...)" style="flex: 2;">
                    <select id="post-category" style="flex: 1;">
                        <option value="Internal Docs">Internal Docs</option>
                        <option value="Research">Research</option>
                        <option value="Beta Access">Beta Access</option>
                    </select>
                    <button class="post-btn" id="submit-post" style="flex: 0.5;">POST</button>
                </div>
            </section>

            <input type="text" id="vault-search" class="search-input" placeholder="Search the ledger...">

            <div class="filter-bar">
                <button class="filter-btn active" id="filter-All">All</button>
                <button class="filter-btn" id="filter-Internal Docs">Docs</button>
                <button class="filter-btn" id="filter-Research">Research</button>
                <button class="filter-btn" id="filter-Beta Access">Beta</button>
            </div>

            <div class="repo-grid" id="dynamic-grid"></div>
        </main>

        <aside class="chat-container">
            <div class="chat-header">
                <span style="font-family: 'JetBrains Mono'; font-size: 0.7rem; color: #22c55e;">● LIVE CHAT</span>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input" placeholder="Message members...">
                <button class="send-btn" id="send-chat">↑</button>
            </div>
        </aside>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, limit } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBfORDp5vNAT6gHFrtmgywJ9wong1bAuo0", authDomain: "jmu-blockchain-member.firebaseapp.com", projectId: "jmu-blockchain-member", storageBucket: "jmu-blockchain-member.firebasestorage.app", messagingSenderId: "98129620187", appId: "1:98129620187:web:d544b08841092ac497f0fe", measurementId: "G-VPLWE1FYZ4" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        let currentFilter = "All";
        let searchQuery = "";
        let allData = [];

        onAuthStateChanged(auth, (user) => {
            if (!user && sessionStorage.getItem('isMember') !== 'true') window.location.href = "index.html";
        });

        /* --- CHAT LOGIC --- */
        const chatInput = document.getElementById('chat-input');
        const sendChat = document.getElementById('send-chat');
        const chatBox = document.getElementById('chat-messages');

        const sendMsg = async () => {
            if (chatInput.value.trim() !== "") {
                await addDoc(collection(db, "club_chat"), {
                    text: chatInput.value,
                    user: auth.currentUser.email,
                    timestamp: serverTimestamp()
                });
                chatInput.value = "";
            }
        };
        sendChat.onclick = sendMsg;
        chatInput.onkeypress = (e) => { if(e.key === 'Enter') sendMsg(); };

        const chatQ = query(collection(db, "club_chat"), orderBy("timestamp", "asc"), limit(50));
        onSnapshot(chatQ, (snapshot) => {
            chatBox.innerHTML = "";
            snapshot.forEach(d => {
                const data = d.data();
                const isMe = auth.currentUser && data.user === auth.currentUser.email;
                const div = document.createElement('div');
                div.className = `msg ${isMe ? 'me' : 'them'}`;
                div.innerHTML = `<span class="msg-user">${data.user.split('@')[0]}</span>${data.text}`;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        /* --- REPOSITORY LOGIC --- */
        document.getElementById('submit-post').onclick = async () => {
            const title = document.getElementById('post-title').value;
            const link = document.getElementById('post-link').value;
            const category = document.getElementById('post-category').value;
            if (title && link) {
                await addDoc(collection(db, "vault_content"), { title, link, category, author: auth.currentUser.email, timestamp: serverTimestamp() });
                document.getElementById('post-title').value = ""; document.getElementById('post-link').value = "";
            }
        };

        const q = query(collection(db, "vault_content"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            allData = [];
            snapshot.forEach(doc => allData.push({ id: doc.id, ...doc.data() }));
            renderGrid();
        });

        document.getElementById('vault-search').oninput = (e) => { searchQuery = e.target.value.toLowerCase(); renderGrid(); };

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.id.replace('filter-', '');
                renderGrid();
            };
        });

        function renderGrid() {
            const grid = document.getElementById('dynamic-grid');
            grid.innerHTML = "";
            const filtered = allData.filter(d => (currentFilter === "All" || d.category === currentFilter) && d.title.toLowerCase().includes(searchQuery));
            filtered.forEach(data => {
                const isAdmin = auth.currentUser && auth.currentUser.email === "charliemonfort17@gmail.com";
                const card = document.createElement('div');
                card.className = 'repo-card';
                card.innerHTML = `
                    <button class="delete-btn" style="${isAdmin ? 'display:block' : 'display:none'}">×</button>
                    <a href="${data.link}" target="_blank" style="text-decoration:none; color:inherit;">
                        <span class="repo-tag">${data.category}</span>
                        <h4 style="margin: 0;">${data.title}</h4>
                    </a>
                `;
                card.querySelector('.delete-btn').onclick = async () => { if(confirm("Delete?")) await deleteDoc(doc(db, "vault_content", data.id)); };
                grid.appendChild(card);
            });
        }

        document.getElementById('logout-btn').onclick = async () => { await signOut(auth); sessionStorage.removeItem('isMember'); window.location.href = "index.html"; };
    </script>
</body>
</html>
